name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f schema/entgra-constitution.schema.json
          test -f templates/entgra-constitution.yml
          test -d constitutions/universal
          test -d examples
